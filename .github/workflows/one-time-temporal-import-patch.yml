name: One-time temporal import patch

on:
  push:
    branches:
      - agent/separate-transaction-date-time-timezone

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply one-time temporal import integration patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/separate-transaction-date-time-timezone
          fetch-depth: 0
      - name: Patch temporal column integration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          validator = "src/app/(app)/businesses/[businessId]/customers/import/transaction-import-validator.tsx"
          replace_once(validator,
          '''const FIELD_LABELS = {
            customerEmail: "بريد العميل",
            transactionDate: "تاريخ المعاملة",
            amountCollected: "المبلغ المحصل",
            transactionId: "رقم المعاملة",
            currency: "العملة",
          } as const satisfies Record<TransactionValidationField, string>;''',
          '''const FIELD_LABELS = {
            customerEmail: "بريد العميل",
            transactionDate: "تاريخ المعاملة",
            transactionTime: "وقت المعاملة",
            timezone: "المنطقة الزمنية",
            amountCollected: "المبلغ المحصل",
            transactionId: "رقم المعاملة",
            currency: "العملة",
          } as const satisfies Record<TransactionValidationField, string>;''')

          replace_once(validator,
          '''  TRANSACTION_DATE_REQUIRED: "تاريخ المعاملة مطلوب.",
            TRANSACTION_DATE_INVALID: "استخدم تاريخًا أو توقيتًا صالحًا مثل 2026-08-23 أو 2026-08-23T14:30:00+03:00.",
            AMOUNT_REQUIRED: "المبلغ المحصل مطلوب.",''',
          '''  TRANSACTION_DATE_REQUIRED: "تاريخ المعاملة مطلوب.",
            TRANSACTION_DATE_INVALID: "استخدم تاريخًا صالحًا مثل 28-Aug-26 أو 2026-08-23.",
            TRANSACTION_TIME_REQUIRED: "يوجد عمود منطقة زمنية لهذا الصف، لذلك وقت المعاملة مطلوب أيضًا.",
            TRANSACTION_TIME_INVALID: "استخدم وقتًا صالحًا مثل 5:34 PM أو 17:34. لا يخمن ميزان الأوقات غير الصالحة أو الملتبسة عند تغيير التوقيت.",
            TIMEZONE_REQUIRED: "يوجد وقت للمعاملة، لذلك المنطقة الزمنية مطلوبة أيضًا.",
            TIMEZONE_INVALID: "استخدم منطقة زمنية IANA صالحة مثل Africa/Cairo.",
            AMOUNT_REQUIRED: "المبلغ المحصل مطلوب.",''')

          old_mapped = '''function mappedColumns(mapping: TransactionColumnMapping) {
            const required = [mapping.customerEmail, mapping.transactionDate, mapping.amountCollected];
            if (!required.every((column): column is number => column !== null)) return null;

            const columns = [...required];
            let transactionIdValueIndex: number | null = null;
            let currencyValueIndex: number | null = null;

            const transactionId = mapping.transactionId ?? null;
            if (transactionId !== null) {
              transactionIdValueIndex = columns.length;
              columns.push(transactionId);
            }

            const currency = mapping.currency ?? null;
            if (currency !== null) {
              currencyValueIndex = columns.length;
              columns.push(currency);
            }

            return { columns, transactionIdValueIndex, currencyValueIndex };
          }'''
          new_mapped = '''function mappedColumns(mapping: TransactionColumnMapping) {
            const required = [mapping.customerEmail, mapping.transactionDate, mapping.amountCollected];
            if (!required.every((column): column is number => column !== null)) return null;

            const columns = [...required];
            let transactionTimeValueIndex: number | null = null;
            let timezoneValueIndex: number | null = null;
            let transactionIdValueIndex: number | null = null;
            let currencyValueIndex: number | null = null;

            const transactionTime = mapping.transactionTime ?? null;
            if (transactionTime !== null) {
              transactionTimeValueIndex = columns.length;
              columns.push(transactionTime);
            }

            const timezone = mapping.timezone ?? null;
            if (timezone !== null) {
              timezoneValueIndex = columns.length;
              columns.push(timezone);
            }

            const transactionId = mapping.transactionId ?? null;
            if (transactionId !== null) {
              transactionIdValueIndex = columns.length;
              columns.push(transactionId);
            }

            const currency = mapping.currency ?? null;
            if (currency !== null) {
              currencyValueIndex = columns.length;
              columns.push(currency);
            }

            return {
              columns,
              transactionTimeValueIndex,
              timezoneValueIndex,
              transactionIdValueIndex,
              currencyValueIndex,
            };
          }'''
          replace_once(validator, old_mapped, new_mapped)

          replace_once(validator,
          '''        amountCollected: row.values[2] ?? "",
                  transactionId:
                    selected.transactionIdValueIndex === null
                      ? undefined
                      : (row.values[selected.transactionIdValueIndex] ?? ""),''',
          '''        amountCollected: row.values[2] ?? "",
                  transactionTime:
                    selected.transactionTimeValueIndex === null
                      ? undefined
                      : (row.values[selected.transactionTimeValueIndex] ?? ""),
                  timezone:
                    selected.timezoneValueIndex === null
                      ? undefined
                      : (row.values[selected.timezoneValueIndex] ?? ""),
                  transactionId:
                    selected.transactionIdValueIndex === null
                      ? undefined
                      : (row.values[selected.transactionIdValueIndex] ?? ""),''')

          replace_once(validator,
          '''        <span>{FIELD_LABELS.transactionDate}</span>
                  <span>{FIELD_LABELS.amountCollected}</span>
                  <span>
                    {FIELD_LABELS.transactionId}:''',
          '''        <span>{FIELD_LABELS.transactionDate}</span>
                  <span>
                    {FIELD_LABELS.transactionTime}: {mapping.transactionTime == null ? "غير موجود" : "تم اختياره"}
                  </span>
                  <span>
                    {FIELD_LABELS.timezone}: {mapping.timezone == null ? "غير موجود" : "تم اختيارها"}
                  </span>
                  <span>{FIELD_LABELS.amountCollected}</span>
                  <span>
                    {FIELD_LABELS.transactionId}:''')

          validation = "src/lib/business/transaction-import-validation.ts"
          replace_once(validation,
          '''    if (
                transactionTime &&
                timezone &&''',
          '''    if (
                ISO_DATE_PATTERN.test(transactionDate) &&
                transactionTime &&
                timezone &&''')

          page = "src/app/(app)/businesses/[businessId]/customers/import/page.tsx"
          replace_once(page,
          '''                <small dir="ltr">Transaction Date</small>
                        <small dir="ltr">مثال: 2026-08-23 أو 2026-08-23T14:30:00+03:00</small>''',
          '''                <small dir="ltr">Transaction Date</small>
                        <small dir="ltr">مثال: 28-Aug-26 أو 2026-08-23</small>''')
          replace_once(page,
          '''              <li>
                        <strong>رقم المعاملة</strong>
                        <small dir="ltr">Transaction ID</small>''',
          '''              <li>
                        <strong>وقت المعاملة</strong>
                        <small dir="ltr">Transaction Time</small>
                        <small dir="ltr">مثال: 5:34 PM أو 17:34</small>
                      </li>
                      <li>
                        <strong>المنطقة الزمنية</strong>
                        <small dir="ltr">Timezone</small>
                        <small dir="ltr">مثال: Africa/Cairo</small>
                        <small>إذا كان الوقت موجودًا كعمود منفصل، اختر المنطقة الزمنية معه ليحوّلهما ميزان إلى توقيت واحد صحيح.</small>
                      </li>
                      <li>
                        <strong>رقم المعاملة</strong>
                        <small dir="ltr">Transaction ID</small>''')

          workflow = Path(".github/workflows/one-time-temporal-import-patch.yml")
          workflow.unlink()
          PY
      - name: Commit patched source
        run: |
          git config user.name "mizan-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate separate gateway time and timezone columns"
          git push origin HEAD:agent/separate-transaction-date-time-timezone
