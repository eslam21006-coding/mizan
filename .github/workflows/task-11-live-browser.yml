name: Task 11 live browser verification

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  verify-live-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://zpfacvowigsscrnyceqh.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZlJYC-raGXAQpneYfhJbEQ_N15Mkj15
      MIZAN_SITE_URL: http://127.0.0.1:3000
      MIZAN_REQUIRE_AUTH_E2E: "true"
      LIVE_BOOTSTRAP_URL: https://zpfacvowigsscrnyceqh.supabase.co/functions/v1/mizan-task11-live-bootstrap-9f3c2e1a
      GH_RUN_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create disposable hosted auth account
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/bootstrap.json" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_RUN_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"action\":\"create\",\"run_id\":\"$GITHUB_RUN_ID\"}" \
            "$LIVE_BOOTSTRAP_URL")"

          if [[ "$status" != "200" ]]; then
            echo "Hosted verification bootstrap failed with HTTP $status"
            node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/bootstrap.json","utf8")); console.error(`${x.error ?? "Unknown bootstrap error"}${x.detail ? `: ${x.detail}` : ""}`)'
            exit 1
          fi

          email="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/bootstrap.json","utf8")); process.stdout.write(x.email)')"
          password="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/bootstrap.json","utf8")); process.stdout.write(x.password)')"
          user_id="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/bootstrap.json","utf8")); process.stdout.write(x.user_id)')"

          echo "::add-mask::$email"
          echo "::add-mask::$password"
          echo "::add-mask::$user_id"
          printf 'MIZAN_E2E_EMAIL=%s\n' "$email" >> "$GITHUB_ENV"
          printf 'MIZAN_E2E_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          printf 'MIZAN_E2E_USER_ID=%s\n' "$user_id" >> "$GITHUB_ENV"
          echo "Disposable hosted mentee created for this verification run."

      - name: Verify hosted password login
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/token.json" --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"$MIZAN_E2E_EMAIL\",\"password\":\"$MIZAN_E2E_PASSWORD\"}" \
            "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/token?grant_type=password")"
          if [[ "$status" != "200" ]]; then
            echo "Hosted password login failed with HTTP $status"
            node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/token.json","utf8")); console.error(x.msg ?? x.message ?? x.error ?? "Unknown login error")'
            exit 1
          fi
          echo "Hosted password login verified."

      - name: Build against hosted Supabase
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run authenticated Arabic RTL dashboard verification
        run: npx playwright test e2e/dashboard.spec.ts

      - name: Clean disposable hosted data and auth account
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MIZAN_E2E_USER_ID:-}" ]]; then
            echo "No disposable user was created."
            exit 0
          fi
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/cleanup.json" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_RUN_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"action\":\"cleanup\",\"run_id\":\"$GITHUB_RUN_ID\",\"user_id\":\"$MIZAN_E2E_USER_ID\"}" \
            "$LIVE_BOOTSTRAP_URL")"
          if [[ "$status" != "200" ]]; then
            echo "Hosted verification cleanup failed with HTTP $status"
            exit 1
          fi
          echo "Disposable hosted verification data removed."

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: task-11-live-browser-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
