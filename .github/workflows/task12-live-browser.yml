name: Task 12 live browser verification

on:
  push:
    branches:
      - agent/task-12-month-over-month-comparisons

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://zpfacvowigsscrnyceqh.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZlJYC-raGXAQpneYfhJbEQ_N15Mkj15
      SUPABASE_SECRET_KEY: sb_secret_live_verification_placeholder
      MIZAN_SITE_URL: http://127.0.0.1:3000
      MIZAN_E2E_EMAIL: mizan-task12-3bbf8046eae2@example.com
      MIZAN_E2E_PASSWORD: eMfVZIerpKFehiCTP_fz_K-LoCPjmisQA1!
      MIZAN_REQUIRE_AUTH_E2E: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build against live Auth project
        run: npm run build

      - name: Install Chromium
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium

      - name: Authenticated Arabic RTL month comparison
        run: npx playwright test e2e/dashboard.spec.ts

      - name: Upload live verification artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: task-12-live-browser
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 3
