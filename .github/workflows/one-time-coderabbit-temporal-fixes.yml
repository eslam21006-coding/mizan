name: One-time CodeRabbit temporal fixes

on:
  push:
    branches:
      - agent/separate-transaction-date-time-timezone

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry CodeRabbit temporal fixes 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/separate-transaction-date-time-timezone
          fetch-depth: 0
      - name: Apply reviewed fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one marker in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_between(path, start, end, replacement):
              p = Path(path)
              text = p.read_text()
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"Missing start marker in {path}: {start!r}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"Missing end marker in {path}: {end!r}")
              p.write_text(text[:start_index] + replacement + text[end_index:])

          # 1) Preserve legacy auto-mapping where a sole combined timestamp header is named "Transaction time".
          mapping = "src/lib/business/transaction-column-mapping.ts"
          marker = "\n  const state = inspectTransactionColumnMapping(mapping);"
          legacy_fallback = '''

            // Legacy exports can label their only combined ISO timestamp as Transaction time or Payment time.
            // Reinterpret it as the required date/timestamp only when no separate date header was recognized.
            if (
              mapping.transactionDate === null &&
              mapping.transactionTime !== null &&
              !ambiguousFields.includes("transactionDate")
            ) {
              const combinedTimestampColumn = mapping.transactionTime;
              mapping = setTransactionFieldColumn(mapping, "transactionDate", combinedTimestampColumn);
              mapping = setTransactionFieldColumn(mapping, "transactionTime", null);
              const timeIndex = recognizedFields.indexOf("transactionTime");
              if (timeIndex >= 0) recognizedFields.splice(timeIndex, 1);
              recognizedFields.push("transactionDate");
            }'''
          replace_once(mapping, marker, legacy_fallback + marker)

          # 2) Preserve ISO years 0001-0099 when making a wall-clock timestamp.
          validation = "src/lib/business/transaction-import-validation.ts"
          replace_between(
              validation,
              "function utcWallClock(parts: DateTimeParts) {",
              "\n}\n\nfunction sameDateTimeParts",
              '''function utcWallClock(parts: DateTimeParts) {
            const value = new Date(0);
            value.setUTCHours(parts.hour, parts.minute, parts.second, 0);
            value.setUTCFullYear(parts.year, parts.month - 1, parts.day);
            return value.getTime();''',
          )

          # 3) Decode native XLSX time-formatted numeric cells before clock parsing.
          parser = "src/lib/business/transaction-source-parser.ts"
          replace_once(
              parser,
              "export type XlsxStyles = {\n  dateStyleIndexes: Set<number>;\n};",
              "export type XlsxStyles = {\n  dateStyleIndexes: Set<number>;\n  timeStyleIndexes?: Set<number>;\n};",
          )
          replace_once(
              parser,
              "const CRC32_TABLE = Array.from",
              "const BUILTIN_TIME_FORMAT_IDS = new Set([18, 19, 20, 21, 45, 47]);\nconst CRC32_TABLE = Array.from",
          )

          parse_styles = '''function customFormatLooksLikeTime(formatCode: string) {
            const withoutLiterals = formatCode.replace(/"[^"]*"/g, "").replace(/\\./g, "");
            if (/\\[(?:h+|m+|s+)\\]/i.test(withoutLiterals)) return false;
            const stripped = withoutLiterals
              .replace(/\\[[^\\]]*]/g, "")
              .replace(/_.|\\*./g, "")
              .toLowerCase();
            if (/[yd]/.test(stripped)) return false;
            return /[hs]/.test(stripped);
          }

          function parseStyles(xml: string | null): XlsxStyles {
            const dateFormatIds = new Set(BUILTIN_DATE_FORMAT_IDS);
            const timeFormatIds = new Set(BUILTIN_TIME_FORMAT_IDS);
            if (!xml) return { dateStyleIndexes: new Set(), timeStyleIndexes: new Set() };

            const sourceXml = stripXmlCommentsOutsideCdata(xml);
            const searchableXml = maskXmlCdataContents(sourceXml);
            const customFormats =
              searchableXml.match(
                /<(?:[A-Za-z_][\\w.-]*:)?numFmt\\b(?:[^>"']|"[^"]*"|'[^']*')*\\/?\\s*>/gi,
              ) ?? [];
            for (const tag of customFormats) {
              const id = Number(attributeValue(tag, "numFmtId"));
              const code = attributeValue(tag, "formatCode");
              if (!Number.isInteger(id) || !code) continue;
              if (customFormatLooksLikeDate(code)) dateFormatIds.add(id);
              else if (customFormatLooksLikeTime(code)) timeFormatIds.add(id);
            }

            const cellXfs = searchableXml.match(
              /<(?:[A-Za-z_][\\w.-]*:)?cellXfs\\b[^>]*>([\\s\\S]*?)<\\/(?:[A-Za-z_][\\w.-]*:)?cellXfs>/i,
            )?.[1];
            const dateStyleIndexes = new Set<number>();
            const timeStyleIndexes = new Set<number>();
            if (!cellXfs) return { dateStyleIndexes, timeStyleIndexes };

            const xfTags = cellXfs.match(/<(?:[A-Za-z_][\\w.-]*:)?xf\\b[^>]*\\/?\\s*>/gi) ?? [];
            xfTags.forEach((tag, index) => {
              const numFmtId = Number(attributeValue(tag, "numFmtId") ?? 0);
              if (dateFormatIds.has(numFmtId)) dateStyleIndexes.add(index);
              else if (timeFormatIds.has(numFmtId)) timeStyleIndexes.add(index);
            });
            return { dateStyleIndexes, timeStyleIndexes };
          }

          '''
          replace_between(
              parser,
              "function parseStyles(xml: string | null): XlsxStyles {",
              "export function columnIndexFromReference",
              parse_styles,
          )

          excel_time = '''function excelTimeString(serialText: string) {
            const serial = Number(serialText);
            if (!Number.isFinite(serial) || serial < 0 || serial >= 1) return serialText;
            const secondsInDay = 86_400;
            const roundedSeconds = Math.round(serial * secondsInDay) % secondsInDay;
            const hour = Math.floor(roundedSeconds / 3_600);
            const minute = Math.floor((roundedSeconds % 3_600) / 60);
            const second = roundedSeconds % 60;
            return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}:${String(second).padStart(2, "0")}`;
          }

          '''
          replace_once(parser, "function textFragments(xml: string) {", excel_time + "function textFragments(xml: string) {")

          replace_between(
              parser,
              '  const styleIndex = Number(attributeValue(tag, "s") ?? -1);',
              "\n}\n\nexport async function readFirstXlsxWorksheet",
              '''  const styleIndex = Number(attributeValue(tag, "s") ?? -1);
            if (Number.isInteger(styleIndex) && styles.dateStyleIndexes.has(styleIndex)) {
              return excelDateString(value, date1904);
            }
            if (Number.isInteger(styleIndex) && styles.timeStyleIndexes?.has(styleIndex)) {
              return excelTimeString(value);
            }
            return value;''',
          )

          # Remove this one-off workflow from the product branch before committing.
          Path(".github/workflows/one-time-coderabbit-temporal-fixes.yml").unlink()
          PY
      - name: Commit fixes
        run: |
          git config user.name "mizan-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix temporal import review findings"
          git push origin HEAD:agent/separate-transaction-date-time-timezone
