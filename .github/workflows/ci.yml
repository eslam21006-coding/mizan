name: Task verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mizan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mizan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      MIZAN_SITE_URL: http://127.0.0.1:3000
      MIZAN_E2E_UI_FIXTURE: "true"
      RLS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mizan_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Configure PostgreSQL client from service image
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mizan-bin"
          cat > "$RUNNER_TEMP/mizan-bin/psql" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --network host \
            -e "PGCONNECT_TIMEOUT=${PGCONNECT_TIMEOUT:-}" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            postgres:17-alpine psql "$@"
          EOF
          chmod +x "$RUNNER_TEMP/mizan-bin/psql"
          echo "$RUNNER_TEMP/mizan-bin" >> "$GITHUB_PATH"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Static checks
        run: npm run check

      - name: Unit, calculation, and database security tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify build did not mutate tracked files
        run: git diff --exit-code

      - name: Install Chromium
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium

      - name: Browser verification
        run: npm run test:e2e

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: task-3-verification
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
